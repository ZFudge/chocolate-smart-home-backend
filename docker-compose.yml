networks:
  csm-backend-network:
    name: csm-backend-network

volumes:
  csm-postgres-vol:
    driver: local
  csm-redis-data:
    driver: local

x-common-attrs: &common-attrs
  env_file: .env
  networks:
    - csm-backend-network

x-environment-variables: &environment-variables
  MQTT_HOST: csm-mosquitto
  MQTT_CLIENT_ID: CSM-FASTAPI-SERVER
  REDIS_HOST: csm-redis
  BACKEND_STREAM_NAME: csm-backend-stream
  WEBSOCKETS_STREAM_NAME: csm-websockets-stream

services:
  csm-mosquitto:
    image: csm-mqtt:prod
    build:
      context: .
      target: csm-mqtt
    container_name: csm-mqtt
    networks:
      - csm-backend-network
    volumes:
      - type: bind
        source: /tmp/logs/mosquitto.log
        target: /mosquitto/log/mosquitto.log
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  csm-postgres-db:
    << : *common-attrs
    image: postgres:12.18-bullseye
    container_name: csm-postgres-db
    ports:
      - 15432:5432
    volumes:
      - csm-postgres-vol:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  csm-redis:
    << : *common-attrs
    image: redis:7.4.1-alpine
    container_name: csm-redis
    ports:
      - 6379:6379
    volumes:
      - csm-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  csm-backend:
    << : *common-attrs
    build:
      context: .
      target: csm-backend
    image: csm-backend:prod
    container_name: csm-backend
    ports:
      - 8000:8000
    volumes:
      - type: bind
        source: /tmp/logs/
        target: /var/logs/csm/
    depends_on:
      csm-postgres-db:
        condition: service_healthy
      csm-mosquitto:
        condition: service_healthy
      csm-redis:
        condition: service_healthy
    command: [
      "pipenv", "run", "uvicorn",
      "src.main:app",
      "--host", "0.0.0.0",
      "--reload",
      "--reload-dir", "src",
      "--reload-exclude", "plugins/device_plugins/*/tests/*",
      "--reload-exclude", "plugins/device_plugins/*/scheduling.py",
      "--reload-exclude", "plugins/virtual_clients/*",
      "--reload-exclude", "scheduler/*",
      "--log-level", "debug",
      "--log-config", "logs.ini"
    ]
    environment:
      << : *environment-variables
    healthcheck:
      test: ["CMD-SHELL", "curl -i http://localhost:8000/healthcheck | grep '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  csm-scheduler:
    << : *common-attrs
    build:
      context: .
      target: csm-backend
    image: csm-backend:prod
    container_name: csm-scheduler
    ports:
      - 8100:8100
    volumes:
      - type: bind
        source: /tmp/logs/
        target: /var/logs/csm/
    command: [
      "pipenv", "run", "uvicorn",
      "src.scheduler.sched_app:sched_app",
      "--host", "0.0.0.0",
      "--reload",
      "--reload-dir", "src/scheduler/",
      "--port=8100",
      "--workers", "1",
      "--log-level", "debug",
      "--log-config", "logs.ini"
    ]
    depends_on:
      csm-mosquitto:
        condition: service_healthy
      csm-postgres-db:
        condition: service_healthy
      csm-backend:
        condition: service_healthy
      csm-redis:
        condition: service_healthy
    environment:
      << : *environment-variables
