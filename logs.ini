[loggers]
keys=root,mqtt,vcs,scheduler

[formatters]
keys=generic

[formatter_generic]
format=[%(levelname)s] %(asctime)s.%(msecs)03d %(module)s %(funcName)s ln: %(lineno)d  %(message)s
datefmt=%y-%m-%d %H:%M:%S

[handlers]
keys=console,root,mqtt,vcs,scheduler

[handler_console]
class=handlers.logging.StreamHandler
args=(sys.stderr,)
level=INFO
formatter=generic

[handler_root]
class=handlers.RotatingFileHandler
args=("/var/logs/csm/backend_root.log", "a")
level=INFO
formatter=generic

[handler_mqtt]
class=handlers.RotatingFileHandler
args=("/var/logs/csm/backend_mqtt.log", "a")
level=INFO
formatter=generic

[handler_vcs]
class=handlers.RotatingFileHandler
args=("/var/logs/csm/vcs.log", "a")
level=INFO
formatter=generic

[handler_scheduler]
class=handlers.RotatingFileHandler
args=("/var/logs/csm/scheduler.log", "a")
level=INFO
formatter=generic

[logger_root]
level=INFO
handlers=console,root
qualname=root

[logger_mqtt]
level=INFO
handlers=console,mqtt
qualname=mqtt
formatter=generic

[logger_vcs]
level=INFO
handlers=console,vcs
qualname=vcs
formatter=generic

[logger_scheduler]
level=INFO
handlers=console,scheduler
qualname=scheduler
formatter=generic
