networks:
  csm-backend-network-dev:
    name: csm-backend-network-dev

volumes:
  csm-postgres-vol-dev:
    driver: local
  csm-redis-data-dev:
    driver: local

x-csm-network: &csm-network
  networks:
    - csm-backend-network-dev

x-common-attrs: &common-attrs
  env_file: .env
  << : *csm-network

x-environment-variables: &environment-variables
  BACKEND_STREAM_NAME: csm-backend-stream-dev
  DB_HOST: csm-postgres-db-dev
  LOG_SUFFIX: -dev
  MQTT_CLIENT_ID: CSM-FASTAPI-SERVER-DEV
  MQTT_HOST: csm-mqtt-dev
  REDIS_HOST: csm-redis-dev
  WEBSOCKETS_STREAM_NAME: csm-websockets-stream-dev

services:
  csm-mqtt-dev:
    image: eclipse-mosquitto:2.0.20
    container_name: csm-mqtt-dev
    << : *csm-network
    volumes:
      - /tmp/csm-logs/:/mosquitto/log/
      - ./mosquitto/mosquitto-dev.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/conf.d/:/mosquitto/config/conf.d/
      - ./scripts/mqtt_healthcheck.sh:/usr/local/bin/healthcheck.sh
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always
  csm-postgres-db-dev:
    << : *common-attrs
    image: postgres:12.18-bullseye
    container_name: csm-postgres-db-dev
    ports:
      - 15432:5432
    volumes:
      - csm-postgres-vol-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  csm-redis-dev:
    << : *common-attrs
    image: redis:7.4.1-alpine
    container_name: csm-redis-dev
    ports:
      - 6379:6379
    volumes:
      - csm-redis-data-dev:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  csm-backend-dev:
    << : *common-attrs
    environment:
      << : *environment-variables
    image: csm-backend:dev
    build:
      context: .
      target: csm-backend
    container_name: csm-backend-dev
    ports:
      - 8000:8000
    volumes:
      - ./:/backend/
      - /tmp/csm-logs/:/var/logs/csm/
    depends_on:
      csm-postgres-db-dev:
        condition: service_healthy
      csm-mqtt-dev:
        condition: service_healthy
      csm-redis-dev:
        condition: service_healthy
    command: [
      "uvicorn", "src.main:app",
      "--host", "0.0.0.0",
      "--reload",
      "--reload-dir", "src",
      "--reload-exclude", "plugins/device_plugins/*/tests/*",
      "--reload-exclude", "plugins/device_plugins/*/scheduling.py",
      "--reload-exclude", "plugins/virtual_clients/*",
      "--reload-exclude", "scheduler/*",
      "--log-level", "debug",
      "--log-config", "logs.ini"
    ]
    healthcheck:
      test: ["CMD-SHELL", "curl -i http://localhost:8000/healthcheck | grep '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  csm-scheduler-dev:
    << : *common-attrs
    environment:
      << : *environment-variables
    image: csm-backend:dev
    container_name: csm-scheduler-dev
    ports:
      - 8100:8100
    volumes:
      - ./:/backend/
      - /tmp/csm-logs/:/var/logs/csm/
    command: [
      "uvicorn", "src.scheduler.sched_app:sched_app",
      "--host", "0.0.0.0",
      "--reload",
      "--reload-dir", "src/",
      "--reload-include", "src/scheduler/",
      "--reload-include", "src/plugins/device_plugins/*/scheduling.py",
      "--port=8100",
      "--workers", "1",
      "--log-level", "debug",
      "--log-config", "logs.ini"
    ]
    depends_on:
      csm-mqtt-dev:
        condition: service_healthy
      csm-postgres-db-dev:
        condition: service_healthy
      csm-backend-dev:
        condition: service_healthy
      csm-redis-dev:
        condition: service_healthy
  virtual-clients:
    << : *common-attrs
    image: csm-backend:dev
    container_name: virtual-clients
    volumes:
      - ./:/backend/
      - /tmp/csm-logs/:/var/logs/csm/
    command: [
      "uvicorn", "src.plugins.virtual_clients.vcs_app:vcs_manager",
      "--port=8200",
      "--workers", "1",
      "--log-level", "debug",
      "--log-config", "logs.ini"
    ]
    depends_on:
      csm-mqtt-dev:
        condition: service_healthy
      csm-postgres-db-dev:
        condition: service_healthy
      csm-backend-dev:
        condition: service_healthy
      csm-redis-dev: # initial startup publish triggers data streaming with redis
        condition: service_healthy
    environment:
      MQTT_CLIENT_ID_PREFIX: virtual-clients
      LOGGER: vcs
      << : *environment-variables
